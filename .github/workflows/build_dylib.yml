name: Build CustomAuth Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-dylib:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobansky/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Compile CustomAuth.dylib
      run: |
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "Using iPhoneOS SDK at: $SDK_PATH"
        
        clang -target arm64-apple-ios14.0 \
          -isysroot "$SDK_PATH" \
          -dynamiclib \
          -fobjc-arc \
          -O2 \
          -framework UIKit \
          -framework Foundation \
          -framework CoreGraphics \
          -framework QuartzCore \
          -install_name @rpath/CustomAuth.dylib \
          -o CustomAuth.dylib \
          CustomAuthViewController.m \
          CustomAuthEntry.m

        echo "Verifying compiled Mach-O binary architecture..."
        file CustomAuth.dylib
        otool -L CustomAuth.dylib

    - name: Upload CustomAuth.dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CustomAuth.dylib
        path: CustomAuth.dylib
