name: Build AuthGate Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-dylib:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile AuthGate.dylib
      run: |
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "Using iPhoneOS SDK at: $SDK_PATH"
        
        clang -target arm64-apple-ios14.0 \
          -isysroot "$SDK_PATH" \
          -dynamiclib \
          -fobjc-arc \
          -O2 \
          -framework UIKit \
          -framework Foundation \
          -framework CoreGraphics \
          -framework QuartzCore \
          -install_name @rpath/AuthGate.dylib \
          -o AuthGate.dylib \
          AuthGate.m

        echo "Verifying compiled Mach-O binary architecture..."
        file AuthGate.dylib
        otool -L AuthGate.dylib

    - name: Upload AuthGate.dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AuthGate.dylib
        path: AuthGate.dylib
