name: Build AuthGate Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-dylib:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile AuthGate.dylib
      run: |
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "Using iPhoneOS SDK at: $SDK_PATH"
        
        # Find AuthGate.m anywhere in the checkout tree
        SRC_FILE=$(find . -name "AuthGate.m" -not -path "*/.*" | head -n 1)
        
        if [ -z "$SRC_FILE" ]; then
          echo "[ERROR] AuthGate.m was not found in the repository root or subfolders."
          echo "Files present in checkout:"
          ls -la
          exit 1
        fi
        
        echo "Found source file at: $SRC_FILE"
        
        clang -target arm64-apple-ios14.0 \
          -isysroot "$SDK_PATH" \
          -dynamiclib \
          -fobjc-arc \
          -O2 \
          -framework UIKit \
          -framework Foundation \
          -framework CoreGraphics \
          -framework QuartzCore \
          -install_name @rpath/AuthGate.dylib \
          -o AuthGate.dylib \
          "$SRC_FILE"

        echo "=== VERIFYING COMPILED MACH-O BINARY ==="
        file AuthGate.dylib
        otool -L AuthGate.dylib

    - name: Upload AuthGate.dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AuthGate.dylib
        path: AuthGate.dylib
